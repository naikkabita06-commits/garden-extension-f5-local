# Service type=LoadBalancer demo for CURRENT svc-lb-bridge behavior.
#
# This manifest intentionally includes only stable base resources:
# - namespace
# - app-a/app-b/app-c deployments
# - case 1 service (no provided IDs)
#
# Cases 2 and 3 require runtime-provided annotations (LB/VIP IDs), so they are
# created in the runbook using kubectl apply -f - with shell variables.

apiVersion: v1
kind: Namespace
metadata:
  name: demo-svc-lb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: demo-svc-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          args: ["--port=5678"]
          ports:
            - name: http
              containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: demo-svc-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-b
  template:
    metadata:
      labels:
        app: app-b
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          args: ["--port=5678"]
          ports:
            - name: http
              containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-c
  namespace: demo-svc-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-c
  template:
    metadata:
      labels:
        app: app-c
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          args: ["--port=5678"]
          ports:
            - name: http
              containerPort: 5678
---
# Case 1 baseline service:
# - no lb-service-id annotation
# - no vip-port-id annotation
# Expected: create/recover LB -> VIP -> VS via normal reconcile flow.
