# Case 2 baseline service:
# - existing lb-service-id annotation
# - existing vip-port-id annotation
# Expected: create/recover LB -> VIP -> VS via normal reconcile flow.


apiVersion: v1
kind: Service
metadata:
  name: app-a-existing-lb-svc
  namespace: demo-svc-lb
  labels:
    demo-step: case-2
  annotations:
    f5.extensions.gardener.cloud/lb-service-id: "1aad8686-6588-40f9-9586-7801fa5302ef"
    f5.extensions.gardener.cloud/lb-service-id-mode: "provided"
    f5.extensions.gardener.cloud/vip-port-id: "36944"
    f5.extensions.gardener.cloud/vip-port-id-mode: "provided"
spec:
  type: LoadBalancer
  loadBalancerClass: f5.extensions.gardener.cloud/bigip
  selector:
    app: app-a
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 5678