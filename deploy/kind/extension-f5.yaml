  providerConfig:
    spec:
      enablePerShootControlPlaneVIP: false
      enableApplicationLB: true

      ccpApiEndpoint: "https://n1devcmp-user.airteldev.com/"
      tenantOrPartition: "qa-tenant"

      vpcId: "ff1067a7-3582-447d-a325-244d89c36cd5"
      vpcName: "vpc-27oct"
      networkId: "b4ca8d86-b6f2-400e-9cb4-c3be9c2d8bad"
      flavorId: 25
      region:  "dev
      
      credentialsReferenceName: cmp-f5-credentials

      cis:
        bridgeImage: "b2bimagerepo.airteluat.cloud/gkaas/gardener-extension-f5:dev-v0.1.0"

    

kubectl apply -f - <<'EOF'
apiVersion: extensions.gardener.cloud/v1alpha1
kind: Extension
metadata:
  name: f5
  namespace: shoot--local--f5-test
spec:
  type: f5-loadbalancer
  providerConfig:
    spec:
      enablePerShootControlPlaneVIP: false
      enableApplicationLB: true

      ccpApiEndpoint: "https://n1devcmp-user.airteldev.com/"
      tenantOrPartition: "qa-tenant"

      vpcId: "ff1067a7-3582-447d-a325-244d89c36cd5"
      vpcName: "vpc-27oct"
      networkId: "b4ca8d86-b6f2-400e-9cb4-c3be9c2d8bad"
      flavorId: 25
      region: "dev"
      imagePullSecrets:
        - name: airtel-registry-pull
      credentialsReferenceName: cmp-f5-credentials

      cis:
        bridgeImage: "b2bimagerepo.airteluat.cloud/gkaas/gardener-extension-f5:dev-v0.1.0"
EOF


kubectl --kubeconfig=/tmp/shoot--local--f5-test.conf \
  -n f5-cis-system \
  patch deployment f5-svc-lb-bridge \
  --type=merge \
  -p '{
    "spec": {
      "template": {
        "spec": {
          "imagePullSecrets": [
            {
              "name": "airtel-registry-pull"
            }
          ]
        }
      }
    }
  }'