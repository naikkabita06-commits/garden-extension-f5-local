apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: local
  namespace: garden-local
  annotations:
    shoot.gardener.cloud/cloud-config-execution-max-delay-seconds: "0"
    authentication.gardener.cloud/issuer: "managed"
spec:
  cloudProfile:
    name: local
  credentialsBindingName: local # dummy, doesn't contain any credentials
  region: local
  resources:
    - name: cmp-f5-credentials
      resourceRef:
        apiVersion: v1
        kind: Secret
        name: cmp-f5-credentials

  extensions:
    - type: f5-loadbalancer
      providerConfig:
        spec:
          enablePerShootControlPlaneVIP: false
          enableApplicationLB: true

          ccpApiEndpoint: "https://n1devcmp-user.airteldev.com/"
          tenantOrPartition: "qa-tenant"

          vpcId: "ff1067a7-3582-447d-a325-244d89c36cd5"
          vpcName: "vpc-27oct"
          networkId: "c15dc29d-218f-4d07-8403-2f1ecf9797cb"
          flavorId: 25
          region: "dev"

          credentialsReferenceName: cmp-f5-credentials

          cis:
            bridgeImage: "registry.local.gardener.cloud:5001/extensions/f5:v0.1.0-dev-gardener-1.139.2-fix7"

  networking:
    type: calico
    # Must be within 10.0.0.0/16 (subnet of kind pod CIDR 10.0.0.0/15, but disjoint with seed pod CIDR 10.1.0.0/16).
    nodes: 10.0.0.0/16
  provider:
    type: local
    workers:
    - name: local
      machine:
        type: local
      cri:
        name: containerd
      minimum: 1
      maximum: 1
      maxSurge: 0
      maxUnavailable: 1
  kubernetes:
    kubelet:
      seccompDefault: true
      serializeImagePulls: false
      registryPullQPS: 10
      registryBurst: 20
      protectKernelDefaults: true
      streamingConnectionIdleTimeout: 5m
